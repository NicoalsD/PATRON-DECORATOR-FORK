AWSTemplateFormatVersion: "2010-09-09"
Description: Celsius Decorator Lab - Spring Boot on Elastic Beanstalk (Corretto 21, single instance)

Parameters:
  SourceBucket:
    Type: String
    Description: S3 bucket that holds the bundle generated by scripts/package-eb.sh
  SourceKey:
    Type: String
    Description: S3 key of decorator-lab-eb.zip
  CnamePrefix:
    Type: String
    Default: celsius-decorator-lab
  SolutionStackName:
    Type: String
    Default: 64bit Amazon Linux 2023 v4.12.9 running Corretto 21
  InstanceType:
    Type: String
    Default: t3.micro

Resources:
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: elasticbeanstalk.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkManagedUpdatesCustomerRolePolicy

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Application:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: decorator-lab
      Description: Celsius Decorator Lab - patrones Decorator, Builder, Abstract Factory y Prototype

  ApplicationVersion:
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    Properties:
      ApplicationName: !Ref Application
      SourceBundle:
        S3Bucket: !Ref SourceBucket
        S3Key: !Ref SourceKey

  Environment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref Application
      EnvironmentName: decorator-lab-env
      CNAMEPrefix: !Ref CnamePrefix
      SolutionStackName: !Ref SolutionStackName
      VersionLabel: !Ref ApplicationVersion
      OptionSettings:
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: SingleInstance
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: !Ref ServiceRole
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref InstanceProfile
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: DisableIMDSv1
          Value: "true"
        - Namespace: aws:ec2:instances
          OptionName: InstanceTypes
          Value: !Ref InstanceType
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: SystemType
          Value: enhanced

Outputs:
  Url:
    Description: Public URL of the application
    Value: !Sub "http://${CnamePrefix}.${AWS::Region}.elasticbeanstalk.com"
  EndpointAddress:
    Description: Elastic IP of the single instance
    Value: !GetAtt Environment.EndpointURL
